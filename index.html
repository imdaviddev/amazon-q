<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🃏 Solitario Klondike</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f4c3a, #2d8659);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .game-area {
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 20px;
            min-height: 600px;
        }
        
        .top-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .stock-waste {
            display: flex;
            gap: 10px;
        }
        
        .foundations {
            display: flex;
            gap: 10px;
        }
        
        .tableau {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .column {
            min-height: 400px;
            width: 80px;
            position: relative;
        }
        
        .card {
            width: 70px;
            height: 100px;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            position: absolute;
            transition: all 0.2s;
            user-select: none;
        }
        
        .card.red {
            background: white;
            color: #d63031;
        }
        
        .card.black {
            background: white;
            color: #2d3436;
        }
        
        .card.back {
            background: linear-gradient(45deg, #0984e3, #6c5ce7);
            color: white;
        }
        
        .card.empty {
            background: rgba(255,255,255,0.2);
            border: 2px dashed rgba(255,255,255,0.5);
            color: rgba(255,255,255,0.7);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .card.selected {
            transform: translateY(-10px);
            box-shadow: 0 0 20px #ffeaa7;
            border-color: #fdcb6e;
        }
        
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #00a085;
        }
        
        .message {
            text-align: center;
            color: white;
            font-size: 18px;
            margin: 10px 0;
            min-height: 25px;
        }
        
        .win-message {
            background: rgba(0, 184, 148, 0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🃏 Solitario Klondike</h1>
        
        <div class="game-area">
            <div class="top-area">
                <div class="stock-waste">
                    <div class="card empty" id="stock" onclick="drawCard()">Stock</div>
                    <div class="card empty" id="waste">Waste</div>
                </div>
                
                <div class="foundations">
                    <div class="card empty foundation" data-foundation="0">♠</div>
                    <div class="card empty foundation" data-foundation="1">♥</div>
                    <div class="card empty foundation" data-foundation="2">♦</div>
                    <div class="card empty foundation" data-foundation="3">♣</div>
                </div>
            </div>
            
            <div class="tableau" id="tableau">
                <div class="column" data-column="0"></div>
                <div class="column" data-column="1"></div>
                <div class="column" data-column="2"></div>
                <div class="column" data-column="3"></div>
                <div class="column" data-column="4"></div>
                <div class="column" data-column="5"></div>
                <div class="column" data-column="6"></div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="controls">
            <button onclick="newGame()">Nuevo Juego</button>
            <button onclick="showRules()">Reglas</button>
        </div>
    </div>

    <script>
        class Card {
            constructor(suit, value) {
                this.suit = suit;
                this.value = value;
                this.faceUp = false;
            }
            
            isRed() {
                return this.suit === '♥' || this.suit === '♦';
            }
            
            getDisplayValue() {
                if (this.value === 1) return 'A';
                if (this.value === 11) return 'J';
                if (this.value === 12) return 'Q';
                if (this.value === 13) return 'K';
                return this.value.toString();
            }
            
            toString() {
                return this.getDisplayValue() + this.suit;
            }
        }

        class Solitaire {
            constructor() {
                this.deck = [];
                this.stock = [];
                this.waste = [];
                this.foundations = [[], [], [], []];
                this.tableau = [[], [], [], [], [], [], []];
                this.selectedCard = null;
                this.selectedSource = null;
                this.initGame();
            }
            
            createDeck() {
                const suits = ['♠', '♥', '♦', '♣'];
                const deck = [];
                
                for (let suit of suits) {
                    for (let value = 1; value <= 13; value++) {
                        deck.push(new Card(suit, value));
                    }
                }
                
                // Shuffle deck
                for (let i = deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [deck[i], deck[j]] = [deck[j], deck[i]];
                }
                
                return deck;
            }
            
            initGame() {
                this.deck = this.createDeck();
                this.stock = [];
                this.waste = [];
                this.foundations = [[], [], [], []];
                this.tableau = [[], [], [], [], [], [], []];
                
                // Deal cards to tableau
                let cardIndex = 0;
                for (let col = 0; col < 7; col++) {
                    for (let row = 0; row <= col; row++) {
                        const card = this.deck[cardIndex++];
                        if (row === col) card.faceUp = true;
                        this.tableau[col].push(card);
                    }
                }
                
                // Remaining cards to stock
                this.stock = this.deck.slice(cardIndex);
                
                this.render();
            }
            
            drawCard() {
                if (this.stock.length > 0) {
                    const card = this.stock.pop();
                    card.faceUp = true;
                    this.waste.push(card);
                } else if (this.waste.length > 0) {
                    // Reset stock from waste
                    this.stock = this.waste.reverse();
                    this.stock.forEach(card => card.faceUp = false);
                    this.waste = [];
                }
                this.render();
            }
            
            canMoveToFoundation(card, foundationIndex) {
                const foundation = this.foundations[foundationIndex];
                const suits = ['♠', '♥', '♦', '♣'];
                
                if (foundation.length === 0) {
                    return card.value === 1 && card.suit === suits[foundationIndex];
                }
                
                const topCard = foundation[foundation.length - 1];
                return card.suit === topCard.suit && card.value === topCard.value + 1;
            }
            
            canMoveToTableau(card, columnIndex) {
                const column = this.tableau[columnIndex];
                
                if (column.length === 0) {
                    return card.value === 13;
                }
                
                const topCard = column[column.length - 1];
                return card.isRed() !== topCard.isRed() && card.value === topCard.value - 1;
            }
            
            moveCard(source, destination) {
                // Implementation for moving cards between different areas
                // This is simplified - full implementation would handle all cases
                this.render();
            }
            
            checkWin() {
                return this.foundations.every(foundation => foundation.length === 13);
            }
            
            render() {
                this.renderStock();
                this.renderWaste();
                this.renderFoundations();
                this.renderTableau();
                
                if (this.checkWin()) {
                    document.getElementById('message').innerHTML = 
                        '<div class="win-message">¡Felicidades! ¡Has ganado!</div>';
                }
            }
            
            renderStock() {
                const stockElement = document.getElementById('stock');
                if (this.stock.length > 0) {
                    stockElement.className = 'card back';
                    stockElement.textContent = this.stock.length;
                } else {
                    stockElement.className = 'card empty';
                    stockElement.textContent = 'Stock';
                }
            }
            
            renderWaste() {
                const wasteElement = document.getElementById('waste');
                if (this.waste.length > 0) {
                    const topCard = this.waste[this.waste.length - 1];
                    wasteElement.className = `card ${topCard.isRed() ? 'red' : 'black'}`;
                    wasteElement.textContent = topCard.toString();
                } else {
                    wasteElement.className = 'card empty';
                    wasteElement.textContent = 'Waste';
                }
            }
            
            renderFoundations() {
                const foundations = document.querySelectorAll('.foundation');
                foundations.forEach((element, index) => {
                    if (this.foundations[index].length > 0) {
                        const topCard = this.foundations[index][this.foundations[index].length - 1];
                        element.className = `card ${topCard.isRed() ? 'red' : 'black'} foundation`;
                        element.textContent = topCard.toString();
                    } else {
                        element.className = 'card empty foundation';
                        const suits = ['♠', '♥', '♦', '♣'];
                        element.textContent = suits[index];
                    }
                });
            }
            
            renderTableau() {
                const columns = document.querySelectorAll('.column');
                columns.forEach((column, colIndex) => {
                    column.innerHTML = '';
                    this.tableau[colIndex].forEach((card, cardIndex) => {
                        const cardElement = document.createElement('div');
                        
                        if (card.faceUp) {
                            cardElement.className = `card ${card.isRed() ? 'red' : 'black'}`;
                            cardElement.textContent = card.toString();
                        } else {
                            cardElement.className = 'card back';
                            cardElement.textContent = '';
                        }
                        
                        cardElement.style.top = `${cardIndex * 20}px`;
                        cardElement.onclick = () => this.selectCard(card, 'tableau', colIndex);
                        column.appendChild(cardElement);
                    });
                });
            }
            
            selectCard(card, source, index) {
                if (this.selectedCard) {
                    // Try to move selected card
                    this.selectedCard = null;
                    this.selectedSource = null;
                } else {
                    // Select card
                    this.selectedCard = card;
                    this.selectedSource = { type: source, index: index };
                }
                this.render();
            }
        }

        let game = new Solitaire();

        function drawCard() {
            game.drawCard();
        }

        function newGame() {
            game = new Solitaire();
            document.getElementById('message').textContent = '';
        }

        function showRules() {
            alert(`REGLAS DEL SOLITARIO KLONDIKE:

1. Objetivo: Mover todas las cartas a las 4 fundaciones en orden ascendente por palo (A, 2, 3... K)

2. Tableau: 7 columnas con cartas, solo la carta superior está boca arriba

3. Stock: Mazo de cartas restantes, haz clic para sacar cartas

4. Movimientos permitidos:
   - Mover cartas entre columnas (rojo sobre negro, valor descendente)
   - Solo el Rey puede ir a una columna vacía
   - Mover cartas a las fundaciones en orden ascendente por palo

5. ¡Ganas cuando todas las cartas estén en las fundaciones!`);
        }
    </script>
</body>
</html>
